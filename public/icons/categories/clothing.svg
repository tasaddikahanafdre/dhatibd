<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Solid Orange Background matching user reference -->
  <rect width="100" height="100" rx="22" fill="#eb5a00"/>
  
  <!-- White Shirt Body & Hem -->
  <path d="M33 32 L30 75 C30 76.5 31.5 77.5 34 77.5 C40 76.8 60 76.8 66 77.5 C68.5 77.5 70 76.5 70 75 L67 32 Z" fill="#ffffff"/>
  
  <!-- Left Sleeve -->
  <path d="M34 31 L21 68 C20.5 70 22 71.5 24 72 L29.5 70 L34 50 Z" fill="#ffffff"/>
  <!-- Left Sleeve Inner Contour / Separation Line -->
  <path d="M33 35 L34 55" stroke="#eb5a00" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left Cuff Seam -->
  <line x1="21.5" y1="66" x2="28.5" y2="68" stroke="#eb5a00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right Sleeve -->
  <path d="M66 31 L79 68 C79.5 70 78 71.5 76 72 L70.5 70 L66 50 Z" fill="#ffffff"/>
  <!-- Right Sleeve Inner Contour / Separation Line -->
  <path d="M67 35 L66 55" stroke="#eb5a00" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right Cuff Seam -->
  <line x1="78.5" y1="66" x2="71.5" y2="68" stroke="#eb5a00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Placket Separation Line -->
  <line x1="49.5" y1="33" x2="49.5" y2="77" stroke="#eb5a00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Buttons (Orange Dots down placket) -->
  <circle cx="52.5" cy="39" r="1.8" fill="#eb5a00"/>
  <circle cx="52.5" cy="47" r="1.8" fill="#eb5a00"/>
  <circle cx="52.5" cy="55" r="1.8" fill="#eb5a00"/>
  <circle cx="52.5" cy="63" r="1.8" fill="#eb5a00"/>
  <circle cx="52.5" cy="71" r="1.8" fill="#eb5a00"/>

  <!-- Chest Patch Pocket (Orange rounded outline) -->
  <path d="M55 42 H63 V50 C63 51.5 61.5 53 59 53 C56.5 53 55 51.5 55 50 Z" stroke="#eb5a00" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- Collars (White leaf flaps with inner orange accent line) -->
  <!-- Left Collar Leaf -->
  <path d="M39 23 L44 36 C42 37 38 37 37 34 L33 28 Z" fill="#ffffff"/>
  <!-- Right Collar Leaf -->
  <path d="M61 23 L56 36 C58 37 62 37 63 34 L67 28 Z" fill="#ffffff"/>
  <!-- Back Neck Collar Stand -->
  <path d="M39 23 C43 21 57 21 61 23 L58 27 C54 26 46 26 42 27 Z" fill="#ffffff"/>
  <!-- Inner Collar V-Line -->
  <path d="M42 27 L50 33 L58 27" stroke="#eb5a00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

</svg>